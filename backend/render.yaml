services:
  - type: web
    name: ai-portfolio-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GROQ_API_KEY
        sync: false # set this in the Render dashboard — never commit it
      # Ordered fallback chain. Setting a single GROQ_MODEL here instead would
      # silently disable the failover, so keep the full list.
      - key: GROQ_MODELS
        value: llama-3.3-70b-versatile,openai/gpt-oss-120b,qwen/qwen3.6-27b,openai/gpt-oss-20b,llama-3.1-8b-instant,openai/gpt-oss-safeguard-20b
      - key: ALLOWED_ORIGINS
        value: https://riteshkr.info,https://www.riteshkr.info,http://localhost:3000
      - key: RATE_LIMIT_REQUESTS
        value: "30"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
