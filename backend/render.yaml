services:
  - type: web
    name: ai-portfolio-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    # Python version comes from backend/.python-version — no env var needed.
    #
    # WHERE THE CHAT LOG LIVES
    # On the free plan the filesystem is wiped on every deploy and every cold
    # start, so anything written to disk is gone within hours. The chat log and
    # the abuse strikes therefore live in Turso (libSQL) — set the two variables
    # below in the dashboard and both survive every restart.
    #
    # Without them the service still runs, it just falls back to a JSONL file
    # that the next cold start deletes.
    #
    # A paid instance with a mounted disk is the other option: uncomment this
    # and set CHAT_LOG_PATH=/var/data/chat_log.jsonl instead of using Turso.
    #
    # disk:
    #   name: chat-log
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: GROQ_API_KEY
        sync: false # set this in the Render dashboard — never commit it
      # Unlocks reading, exporting and deleting the chat log. Set it in the
      # dashboard; whoever holds it can read every visitor's details.
      - key: ADMIN_TOKEN
        sync: false
      # Turso (libSQL) — what keeps the chat log across deploys and cold starts.
      # Create a database at turso.tech, then set both of these in the
      # dashboard. TURSO_AUTH_TOKEN grants full read/write, so never commit it.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # - key: CHAT_LOG_PATH        # only with the disk above
      #   value: /var/data/chat_log.jsonl
      # Ordered fallback chain. Setting a single GROQ_MODEL here instead would
      # silently disable the failover, so keep the full list.
      - key: GROQ_MODELS
        value: llama-3.3-70b-versatile,openai/gpt-oss-120b,qwen/qwen3.6-27b,openai/gpt-oss-20b,llama-3.1-8b-instant,openai/gpt-oss-safeguard-20b
      - key: ALLOWED_ORIGINS
        value: https://riteshkr.info,https://www.riteshkr.info,http://localhost:3000
      - key: RATE_LIMIT_REQUESTS
        value: "30"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
